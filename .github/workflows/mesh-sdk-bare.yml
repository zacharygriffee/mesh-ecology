name: Mesh SDK Bare CI

on:
  push:
    branches:
      - main
    paths:
      - "packages/mesh-sdk/**"
      - "test/sdk/**"
      - "test/bare-labs/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mesh-sdk-bare.yml"
  workflow_dispatch:

jobs:
  mesh-sdk-bare:
    name: mesh-sdk-bare (bare@${{ matrix.bare-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bare-version:
          - "1.27.0"
          - "latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Bare runtime
        run: npm install --global bare@${{ matrix.bare-version }}

      - name: Verify Bare runtime
        run: bare --version

      - name: Run mesh-sdk dual-runtime checks
        env:
          MESH_SDK_RUN_BARE: "1"
        run: |
          npm --prefix packages/mesh-sdk run guard:bare-import-graph
          npm --prefix packages/mesh-sdk run guard:bare-e2e-import-graph
          npm --prefix packages/mesh-sdk run smoke:node-exports
          npm --prefix packages/mesh-sdk run test:conformance
          npm --prefix packages/mesh-sdk run test:bare-runtime
          npm --prefix packages/mesh-sdk run test:bare-e2e
          npm test -- test/sdk/mesh-sdk.bare-labs.test.js
          npm --prefix packages/mesh-sdk run test:hashport
          npm --prefix packages/mesh-sdk run test:hashport-conformance
          npm --prefix packages/mesh-sdk run test:hashport-parity
          npm test -- test/concern/apply-runtime-agnostic.test.js
          npm test -- test/sdk/mesh-sdk.client.test.js
          npm test -- test/sdk/mesh-sdk.dual-runtime-structure.test.js
          npm test -- test/sdk/mesh-sdk.hashport-parity.test.js
          npm test -- test/sdk/mesh-sdk.bare-runtime.test.js
          npm test -- test/sdk/mesh-sdk.bare-e2e.test.js
