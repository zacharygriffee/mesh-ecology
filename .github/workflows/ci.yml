name: CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "packages/**"
      - "scripts/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "packages/**"
      - "scripts/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  unit-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run fast deterministic subset
        run: |
          node test/run-files.js \
            test/concern \
            test/discovery \
            test/encoding \
            test/utility \
            test/validity \
            test/mesh-operator-cli.help.test.js

  unit-medium:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run broader deterministic runtime coverage
        run: |
          node test/run-files.js \
            test/runner \
            test/ratifier \
            test/replication \
            test/sdk/mesh-sdk.client.test.js

  labs-network-strict:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run ecology labs (real network, strict)
        run: CI=1 node test/run-files.js test/labs/

  ecology-smoke:
    if: github.event_name != 'pull_request'
    needs: [unit-fast, unit-medium]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Reset ecology smoke store
        run: rm -rf ./store/ecology-smoke

      - name: Run ecology orchestration smoke (real swarm, 20s)
        run: |
          ECO_DURATION_MS=20000 \
          ECO_READY_MS=45000 \
          ECO_STORE_ROOT=./store/ecology-smoke \
          ECO_SEED=ci-smoke \
          node scripts/run-ecology.js
